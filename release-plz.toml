# Release config for release-plz (https://release-plz.dev). The crate isn't published, so
# release-plz reads the last release from the `v*` git tags and releases each version as a
# `v<version>` tag and GitHub release.

[workspace]
git_only = true
# Only release when a release PR merges, not on every push to main.
release_always = false
# A `feat:` bumps minor even before 1.0, so a release with new features never reads as a patch.
features_always_increment_minor = true
# cargo-semver-checks compares against a published crate; there is none.
semver_check = false
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
