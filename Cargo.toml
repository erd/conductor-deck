[package]
name = "conductor-deck"
description = "herdr plugin that shows conductor tasks as stacked cards"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/erd/conductor-deck"
publish = false

[dependencies]
conductor-state = { git = "https://github.com/erd/conductor", tag = "v0.1.0" }
crossterm = "0.28"
jiff = { version = "0.2", features = ["serde"] }
notify = "8"
# `unstable-rendered-line-info` sizes the wrapped toast.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
